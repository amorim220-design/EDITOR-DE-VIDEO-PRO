name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Verify project files
        run: |
          echo "===== MainActivity ====="
          find app/src -name "MainActivity.kt"

          echo "===== Manifest ====="
          find app/src -name "AndroidManifest.xml"

          echo "===== Package ====="
          grep -R "package com.example" app/src/main/java || true

      - name: Build APK
        run: |
          ./gradlew clean assembleDebug --stacktrace --info

      - name: Check generated APK
        run: |
          echo "===== APK ====="
          find app/build -name "*.apk"

          APK=$(find app/build -name "*.apk" | head -n 1)

          echo "APK: $APK"

          unzip -l "$APK" | head -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            build/reports
