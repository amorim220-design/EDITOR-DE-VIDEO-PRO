name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK and AAB
      run: ./gradlew assembleDebug bundleDebug

    - name: Build Release APK and AAB
      run: ./gradlew assembleRelease bundleRelease
      continue-on-error: true # Allow failure if signing is not configured

    - name: Verify MainActivity exists in Debug APK
      run: |
        if command -v unzip > /dev/null; then
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "classes.dex" && echo "Classes.dex found" || exit 1
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Debug AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-aab
        path: app/build/outputs/bundle/debug/app-debug.aab

    - name: Upload Release APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Upload Release AAB
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/*.aab
