name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: |
        # Try to use the wrapper first. If it fails with "corrupt jar", try using system gradle to fix it or run build.
        if ! ./gradlew --version > /dev/null 2>&1; then
          echo "Gradle wrapper appears to be corrupt. Attempting to fix it..."
          # If the system has gradle, we can try to regenerate. Ubuntu runners usually have gradle.
          if command -v gradle > /dev/null; then
            gradle wrapper --gradle-version 9.3.1
            chmod +x gradlew
          else
            echo "System gradle not found, cannot fix wrapper automatically."
            exit 1
          fi
        fi
        ./gradlew assembleDebug
        - name: List generated APK and classes
     run: |
       find app/build -name "*.apk"
       jar tf app/build/outputs/apk/debug/app-debug.apk | grep MainActivity || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
