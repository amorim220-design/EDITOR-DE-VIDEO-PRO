name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Show project structure
        run: |
          echo "======================="
          echo "MainActivity:"
          find . -name "MainActivity.kt"

          echo "======================="
          echo "AndroidManifest:"
          find . -name "AndroidManifest.xml"

          echo "======================="
          echo "build.gradle.kts:"
          find . -name "build.gradle.kts"

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --info

      - name: Locate APK
        run: |
          echo "======================="
          echo "Generated APK:"
          find app/build -name "*.apk"

      - name: Print merged manifest
        run: |
          echo "======================="
          find app/build -name "AndroidManifest.xml" -exec echo "FILE: {}" \; -exec cat {} \;

      - name: Verify MainActivity class
        run: |
          echo "======================="
          APK=$(find app/build/outputs -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK: $APK"

          unzip -l "$APK" | grep -i "classes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            app/build/reports
            build/reports
